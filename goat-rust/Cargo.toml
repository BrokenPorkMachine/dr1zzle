[package]
name = "goat"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "goat"
path = "src/main.rs"

[dependencies]
aes = "0.8"
libc = "0.2"
libusb1-sys = "0.7"
num-bigint = { version = "0.4", features = ["rand"] }
num-traits = "0.2"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[workspace]
