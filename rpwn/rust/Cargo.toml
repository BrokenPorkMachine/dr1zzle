# Standalone workspace root: the parent directory contains an unrelated Cargo project,
# and cargo would otherwise try to enrol this crate in it.
[workspace]

[package]
name = "rpwn"
version = "1.0.0"
edition = "2021"
description = "RPWN: original Rust DFU research and device tooling"
license = "GPL-3.0-only"
publish = false

[[bin]]
name = "rpwn"
path = "src/main.rs"

[dependencies]
libusb1-sys = "0.7"
aes = "0.8"
crc32fast = "1"
sha1 = "0.10"
sha2 = "0.10"

[profile.release]
opt-level = 3

[dev-dependencies]
capstone = "0.14"
